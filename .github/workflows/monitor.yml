name: 24/7 Multi-Site Notice Monitor

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev ffmpeg libsm6 libxext6

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytesseract opencv-python pillow requests
          playwright install --with-deps chromium

      - name: Restore Cache Files
        uses: actions/cache@v3
        with:
          path: last_*.txt
          key: notice-cache-${{ github.run_id }}
          restore-keys: |
            notice-cache-

      - name: Run Notice Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # Update Linux Tesseract path dynamically in environment
          TESSERACT_CMD: "/usr/bin/tesseract"
        run: python main.py
